name: Lockdown untrusted workflows

# PROCESS
#
# 1. Verifies .github/workflows/actions.lock is in sync with the workflows and that every
#    locked action commit still resolves upstream (https://gh.io/actions-lockfile)
# 2. Fail CI and prevent PRs to be merged if the lockfile is stale or a pin no longer verifies
#
# After adding or changing any `uses:` reference, run `gh actions-lock` locally and commit
# the updated lockfile.

# USAGE
#
# Always triggered on new PR, PR changes and PR merge.

on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lockfile:
    name: Verify actions lockfile
    if: contains(fromJson('["aws-samples", "jplock"]'), github.repository_owner)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify actions lockfile
        run: gh actions-lock --verify
