name: Lockdown untrusted workflows

# PROCESS
#
# 1. Verifies .github/workflows/actions.lock is in sync with the workflows
# 2. Verifies every locked commit still resolves upstream for its ref
# 3. Fail CI and prevent PRs to be merged if either check fails

# USAGE
#
# Always triggered on new PR, PR changes and PR merge.
# Run `gh actions-lock` locally to regenerate the lockfile after changing any `uses:`.

on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify_lockfile:
    name: Verify actions lockfile
    if: contains(fromJson('["aws-samples", "jplock"]'), github.repository_owner)
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify lockfile
        run: gh actions-lock --verify
