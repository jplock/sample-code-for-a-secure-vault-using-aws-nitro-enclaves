name: docker bake

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: never
  NO_COLOR: 1

jobs:
  docker:
    if: contains(fromJson('["aws-samples", "jplock"]'), github.repository_owner)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3.12.0
      - name: Build
        uses: docker/bake-action@v6.10.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          push: false
