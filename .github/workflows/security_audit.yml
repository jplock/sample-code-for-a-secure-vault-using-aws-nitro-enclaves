name: Security audit
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security_audit.yml'
  workflow_dispatch:
jobs:
  security_audit:
    runs-on: ubuntu-24.04-arm
    if: contains(fromJson('["aws-samples", "jplock"]'), github.repository_owner)
    permissions:
      issues: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1
      - uses: rustsec/audit-check@v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.79.10
        with:
          tool: cargo-deny
      - name: cargo-deny check
        run: cargo-deny check
